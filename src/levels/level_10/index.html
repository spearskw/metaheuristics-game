<!DOCTYPE html>
<html lang="en">
<head>
    <title>Level 10 - Mona Lisa Polygons</title>
    <script src="main.js" type="module"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Paintings from Polygons</h1>
<div class="layout">
    <div class="controls">
        <label for="cooling-schedule">Cooling Schedule:</label>
        <select id="cooling-schedule">
            <option value="geometric" selected>Geometric</option>
            <option value="linear">Linear</option>
            <option value="linearReheat">Linear Reheat</option>
            <option value="cosine">Cosine</option>
        </select>

        <label for="polygons">Polygons: <span id="polygons-value">125</span></label>
        <input type="range" id="polygons" min="10" max="300" value="125" step="5">

        <label for="iterations">Iterations: <span id="iterations-value">200000</span></label>
        <input type="range" id="iterations" min="1000" max="500000" value="200000" step="1000">

        <label for="temperature">Initial Temp: <span id="temperature-value">400</span></label>
        <input type="range" id="temperature" min="10" max="5000" value="400" step="10">

        <label for="speed">Batch size: <span id="speed-value">100</span></label>
        <input type="range" id="speed" min="1" max="500" value="100" step="1">

        <button id="start">Start</button>

        <p>Iteration: <span id="iteration-display">-</span></p>
        <p>Best MSE: <span id="mse-display">-</span></p>
        <p>Temperature: <span id="temp-display">-</span></p>
    </div>
    <div class="canvases">
        <div class="canvas-tile">
            <div>Polygon Approximation</div>
            <canvas id="polygon-canvas" width="320" height="480"></canvas>
        </div>
        <div class="canvas-tile">
            <div>Fitness (MSE)</div>
            <canvas id="score-canvas" width="480" height="480"></canvas>
        </div>
    </div>
</div>
</body>
</html>
